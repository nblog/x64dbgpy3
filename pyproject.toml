[project]
name = "x64dbgpy3"
version = "1.1.1"
description = "A Python 3 framework for automating x64dbg operations via scripting with MCP support."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lz4==0.18.0",
    "httpx",
    "pydantic",
]

[project.optional-dependencies]
dev = ["yara-python", "capstone"]
mcp = ["agent-framework"]

[project.scripts]
x64dbgpy3-mcp = "x64dbgmcp:main"
